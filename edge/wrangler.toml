# Atelier VidGen edge worker — static panel + R2 exchange + Kaggle WAKE switch.
# Deploy: CLOUDFLARE_API_TOKEN=$(...) CLOUDFLARE_ACCOUNT_ID=$(...) npx wrangler deploy
name = "vidgen"
main = "worker.js"
compatibility_date = "2026-01-15"

[assets]
directory = "./panel"
binding = "ASSETS"          # asset requests never invoke the Worker (0 CPU, free)

[[r2_buckets]]
binding = "CTRL"            # the shared exchange: vidgen/jobs|status|results + boot/*
bucket_name = "imagegen-ctrl"

[observability]
enabled = true
